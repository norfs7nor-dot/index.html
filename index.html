<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMONE Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #0f172a; color: white; text-align: center; padding: 30px 15px; margin: 0; }
        .card { background: #1e293b; max-width: 420px; margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .balance-box { font-size: 34px; font-weight: bold; color: #22c55e; margin: 20px 0; }
        .btn { background: #2563eb; color: white; border: none; padding: 14px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:disabled { background: #64748b; cursor: not-allowed; }
        .timer { margin-top: 15px; color: #94a3b8; font-size: 14px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .status { margin-top: 10px; font-size: 14px; color: #f59e0b; }
        .small-note { margin-top: 10px; color: #cbd5e1; font-size: 12px; }
    </style>
</head>
<body>

<div class="card" id="loginCard">
    <h2>تسجيل الدخول</h2>
    <input type="email" id="emailInput" placeholder="أدخل بريدك الإلكتروني">
    <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
    <button class="btn" id="loginBtn" onclick="loginUser()">دخول / تسجيل</button>
    <div class="status" id="loginStatus"></div>
    <div class="small-note">ملاحظة: هذه نسخة تجريبية، وتحتاج إلى ربطها بـ Supabase وملء بيانات المشروع.</div>
</div>

<div class="card" id="appCard" style="display:none;">
    <h2>رصيدك الحالي</h2>
    <div class="balance-box" id="balanceDisplay">$0.00</div>
    <button class="btn" id="runBtn" onclick="runMining()">تشغيل التعدين (+3%)</button>
    <div class="timer" id="timerDisplay"></div>
</div>

<script>
    // استبدل هاتين القيمتين ببيانات مشروعك من Supabase
    const SUPABASE_URL = 'https://hdokwptxeveharhqfesx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_KdsOTT-M5gzFCdrJ5iBhfw_rkAP4098';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUserEmail = '';

    async function loginUser() {
        const emailInput = document.getElementById('emailInput').value.trim();
        const passwordInput = document.getElementById('passwordInput').value.trim();
        const statusDiv = document.getElementById('loginStatus');
        const loginBtn = document.getElementById('loginBtn');

        if (!emailInput || !passwordInput) {
            alert('الرجاء إدخال البريد الإلكتروني وكلمة المرور');
            return;
        }

        loginBtn.disabled = true;
        statusDiv.innerText = 'جاري تسجيل الدخول...';

        try {
            let { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('email', emailInput)
                .eq('password', passwordInput)
                .maybeSingle();

            if (error) throw error;

            if (!data) {
                let { data: newData, error: insertError } = await supabase
                    .from('users')
                    .insert([{ email: emailInput, password: passwordInput, balance: 0, last_run: null }])
                    .select()
                    .single();

                if (insertError) throw insertError;
                data = newData;
            }

            currentUserEmail = data.email;
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('appCard').style.display = 'block';
            updateUI(data);

        } catch (err) {
            alert('حدث خطأ أثناء الاتصال بقاعدة البيانات: ' + err.message);
            statusDiv.innerText = '';
            loginBtn.disabled = false;
        }
    }

    function updateUI(user) {
        document.getElementById('balanceDisplay').innerText = '$' + parseFloat(user.balance || 0).toFixed(2);

        if (user.last_run) {
            let lastRunTime = new Date(user.last_run).getTime();
            let now = new Date().getTime();
            let timePassed = now - lastRunTime;
            let hours24 = 24 * 60 * 60 * 1000;

            if (timePassed < hours24) {
                document.getElementById('runBtn').disabled = true;
                let remaining = hours24 - timePassed;
                let hoursLeft = Math.floor(remaining / (1000 * 60 * 60));
                let minutesLeft = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('timerDisplay').innerText = `يمكنك التشغيل مجدداً بعد: ${hoursLeft} ساعة و ${minutesLeft} دقيقة`;
            } else {
                document.getElementById('runBtn').disabled = false;
                document.getElementById('timerDisplay').innerText = '';
            }
        }
    }

    async function runMining() {
        const runBtn = document.getElementById('runBtn');
        runBtn.disabled = true;

        try {
            let { data: user, error: fetchErr } = await supabase
                .from('users')
                .select('*')
                .eq('email', currentUserEmail)
                .single();

            if (fetchErr) throw fetchErr;

            let currentBalance = parseFloat(user.balance || 0);
            let newBalance = currentBalance + (currentBalance * 0.03);
            let nowTime = new Date().toISOString();

            let { data: updatedUser, error: updateErr } = await supabase
                .from('users')
                .update({ balance: newBalance, last_run: nowTime })
                .eq('email', currentUserEmail)
                .select()
                .single();

            if (updateErr) throw updateErr;

            updateUI(updatedUser);
            alert('تم تشغيل التعدين بنجاح وإضافة 3% لرصيدك!');

        } catch (err) {
            alert('حدث خطأ: ' + err.message);
            runBtn.disabled = false;
        }
    }
</script>

</body>
</html>
