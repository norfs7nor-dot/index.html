<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMONE Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #0f172a; color: white; text-align: center; padding: 30px 15px; margin: 0; }
        .card { background: #1e293b; max-width: 420px; margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .balance-box { font-size: 34px; font-weight: bold; color: #22c55e; margin: 20px 0; }
        .btn { background: #2563eb; color: white; border: none; padding: 14px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:disabled { background: #64748b; cursor: not-allowed; }
        .timer { margin-top: 15px; color: #94a3b8; font-size: 14px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .status { margin-top: 10px; font-size: 14px; color: #f59e0b; }
        .small-note { margin-top: 10px; color: #cbd5e1; font-size: 12px; }
        .row { display:flex; gap:10px; }
    </style>
</head>
<body>

<div class="card" id="loginCard">
    <h2>تسجيل الدخول / إنشاء حساب</h2>
    <input type="email" id="emailInput" placeholder="أدخل بريدك الإلكتروني">
    <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
    <div class="row">
      <button class="btn" id="signUpBtn" onclick="signUp()">إنشاء حساب</button>
      <button class="btn" id="signInBtn" onclick="signIn()">تسجيل دخول</button>
    </div>
    <div class="status" id="loginStatus"></div>
    <div class="small-note">ملاحظة: تم تعديل التطبيق لاستخدام Supabase Auth وملف Profiles منفصل لتخزين الرصيد.</div>
</div>

<div class="card" id="appCard" style="display:none;">
    <h2>رصيدك الحالي</h2>
    <div class="balance-box" id="balanceDisplay">$0.00</div>
    <button class="btn" id="runBtn" onclick="runMining()">تشغيل التعدين (+3%)</button>
    <button class="btn" id="logoutBtn" style="margin-top:10px; background:#ef4444;">تسجيل خروج</button>
    <div class="timer" id="timerDisplay"></div>
</div>

<script>
    // تم إدخال بيانات المشروع من قبلك
    const SUPABASE_URL = 'https://hdokwptxeveharhqfesx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_KdsOTT-M5gzFCdrJ5iBhfw_rkAP4098';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null; // object from supabase.auth

    // Helpers
    function showStatus(msg) { document.getElementById('loginStatus').innerText = msg || ''; }

    async function signUp() {
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        if (!email || !password) { alert('الرجاء إدخال البريد الإلكتروني وكلمة المرور'); return; }
        showStatus('جاري إنشاء الحساب...');
        try {
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) throw error;
            // data.user may be returning null if email confirmation required; handle gracefully
            currentUser = data.user || null;
            // Ensure profile exists (if user id available). If not available, tell user to check email.
            if (currentUser && currentUser.id) await ensureProfile(currentUser.id);
            showStatus('تم إنشاء الحساب. إذا تطلب المشروع تأكيد البريد، تحقق من بريدك ثم سجّل الدخول.');
        } catch (err) {
            alert('خطأ أثناء إنشاء الحساب: ' + (err.message || err));
            showStatus('');
        }
    }

    async function signIn() {
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        if (!email || !password) { alert('الرجاء إدخال البريد الإلكتروني وكلمة المرور'); return; }
        showStatus('جاري تسجيل الدخول...');
        try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            currentUser = data.user;
            if (!currentUser) {
                showStatus('تم تسجيل طلب تسجيل الدخول — تحقق من بريدك إذا كانت هناك خطوة تأكيد.');
                return;
            }
            await ensureProfile(currentUser.id);
            const profile = await fetchProfile(currentUser.id);
            openApp(profile);
        } catch (err) {
            alert('خطأ أثناء تسجيل الدخول: ' + (err.message || err));
            showStatus('');
        }
    }

    async function ensureProfile(uid) {
        // Create a profiles row if it doesn't exist. Assumes table public.profiles with primary key id (uuid)
        try {
            const { data: existing } = await supabase.from('profiles').select('id').eq('id', uid).maybeSingle();
            if (!existing) {
                await supabase.from('profiles').insert([{ id: uid, balance: 0, last_run: null }]);
            }
        } catch (err) {
            console.warn('ensureProfile error', err);
        }
    }

    async function fetchProfile(uid) {
        const { data, error } = await supabase.from('profiles').select('*').eq('id', uid).maybeSingle();
        if (error) throw error;
        return data;
    }

    function openApp(profile) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('appCard').style.display = 'block';
        document.getElementById('logoutBtn').onclick = signOut;
        updateUI(profile);
    }

    function updateUI(profile) {
        document.getElementById('balanceDisplay').innerText = '$' + parseFloat(profile?.balance || 0).toFixed(2);
        if (profile?.last_run) {
            let lastRunTime = new Date(profile.last_run).getTime();
            let now = Date.now();
            let timePassed = now - lastRunTime;
            let hours24 = 24 * 60 * 60 * 1000;
            if (timePassed < hours24) {
                document.getElementById('runBtn').disabled = true;
                let remaining = hours24 - timePassed;
                let hoursLeft = Math.floor(remaining / (1000 * 60 * 60));
                let minutesLeft = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('timerDisplay').innerText = `يمكنك التشغيل مجدداً بعد: ${hoursLeft} ساعة و ${minutesLeft} دقيقة`;
            } else {
                document.getElementById('runBtn').disabled = false;
                document.getElementById('timerDisplay').innerText = '';
            }
        } else {
            document.getElementById('runBtn').disabled = false;
            document.getElementById('timerDisplay').innerText = '';
        }
    }

    async function runMining() {
        if (!currentUser || !currentUser.id) { alert('الرجاء تسجيل الدخول أولاً'); return; }
        const runBtn = document.getElementById('runBtn');
        runBtn.disabled = true;
        try {
            const profile = await fetchProfile(currentUser.id);
            let currentBalance = parseFloat(profile?.balance || 0);
            // If balance is zero, give a base amount instead of staying zero
            if (currentBalance === 0) currentBalance = 1.00;
            let newBalance = currentBalance + (currentBalance * 0.03);
            let nowTime = new Date().toISOString();
            const { data: updated, error: updateErr } = await supabase
                .from('profiles')
                .update({ balance: newBalance, last_run: nowTime })
                .eq('id', currentUser.id)
                .select()
                .single();
            if (updateErr) throw updateErr;
            updateUI(updated);
            alert('تم تشغيل التعدين بنجاح وإضافة 3% لرصيدك!');
        } catch (err) {
            alert('حدث خطأ: ' + (err.message || err));
            runBtn.disabled = false;
        }
    }

    async function signOut() {
        await supabase.auth.signOut();
        currentUser = null;
        document.getElementById('loginCard').style.display = 'block';
        document.getElementById('appCard').style.display = 'none';
        showStatus('تم تسجيل الخروج');
    }

    // On load: check session
    (async function init() {
        const { data } = await supabase.auth.getSession();
        const session = data.session;
        if (session && session.user) {
            currentUser = session.user;
            try {
                await ensureProfile(currentUser.id);
                const profile = await fetchProfile(currentUser.id);
                openApp(profile);
            } catch (err) { console.warn('init error', err); }
        }
    })();

</script>

</body>
</html>
